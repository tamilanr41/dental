<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F5" />
    <meta
      name="description"
      content="Sri Saraswathi Dental Clinic, Erode — AI-assisted dentistry with expert care. Book in 60 seconds, get smart triage, and preview your new smile."
    />
    <title>Sri Saraswathi Dental Clinic — Your Smile, Reimagined</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Roboto:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      if (window.location.pathname === "/") {
        const heroImagePreload = document.createElement("link");
        heroImagePreload.rel = "preload";
        heroImagePreload.as = "image";
        heroImagePreload.href = "/images/clinic/hero-dental-care.webp";
        heroImagePreload.setAttribute("fetchpriority", "high");
        document.head.append(heroImagePreload);
      }
      history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      document.addEventListener("DOMContentLoaded", function () { window.scrollTo(0, 0); });
      window.addEventListener("load", function () { window.scrollTo(0, 0); });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
